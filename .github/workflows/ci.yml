name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify repository has no obvious local paths or secrets
        shell: bash
        run: |
          if git grep -n -I -E '[A-Za-z]:\\Users\\|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]+' -- . ':!docs/superpowers/**' ':!.github/workflows/ci.yml'; then
            echo "Sensitive-looking content found" >&2
            exit 1
          fi

      - name: Run unit and container integration tests
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode verify

      - name: Smoke-build application image
        run: docker build -t media-deep-pagination-demo:ci .
