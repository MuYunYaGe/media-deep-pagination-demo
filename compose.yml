services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-media_demo}
      MYSQL_USER: ${MYSQL_USER:-media_demo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-media_demo}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_only}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-media_demo}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-media_demo}
      DB_PASSWORD: ${MYSQL_PASSWORD:-media_demo}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAGINATION_WINDOW_SIZE: ${PAGINATION_WINDOW_SIZE:-30000}
      SHALLOW_FALLBACK_MAX_OFFSET: ${SHALLOW_FALLBACK_MAX_OFFSET:-1000}
      HOT_CATEGORY_IDS: ${HOT_CATEGORY_IDS:-1001,1002}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  mysql-data:
  redis-data:
